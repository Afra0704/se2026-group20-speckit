name: Time display POSIX verification

on:
  push:
    branches:
      - codex/integrate-issues-19-20
    paths:
      - src/guided_notes/time_display.py
      - src/guided_notes/time_views.py
      - tests/integration/test_time_display_process_tz.py
      - .github/workflows/time-display-posix.yml
  pull_request:
    branches: [master]
    paths:
      - src/guided_notes/time_display.py
      - src/guided_notes/time_views.py
      - tests/integration/test_time_display_process_tz.py
      - .github/workflows/time-display-posix.yml

permissions:
  contents: read

jobs:
  posix-timezones:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install only pure-time test dependencies
        run: python -m pip install 'Flask>=3.1,<4' 'pytest>=8,<10'
      - name: Run actual POSIX timezone subprocesses
        run: >-
          python -m pytest --noconftest
          tests/integration/test_time_display_process_tz.py
          -q -s --junitxml=time-display-posix.xml
      - name: Reject skipped or missing timezone verification
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('time-display-posix.xml').getroot().iter('testsuite'))
          totals = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          assert totals == {'tests': 1, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          print('POSIX timezone test ran without skips:', totals)
          PY
