{% extends 'workspace/base.html' %}{% block content %}<h2>{{ room.title }}</h2><p id="code" class="classroom-code">課堂碼：{{ room.code }}{% if room.state=='CLOSED' %}（已失效，可能重用）{% endif %}</p><section class="card"><h3>已加入組別</h3><ul id="classroom-groups" aria-live="polite"><li>尚無學生組別</li></ul></section><section class="card" aria-labelledby="activities-heading">
        <div class="section-heading">
          <h2 id="activities-heading">講義活動</h2>
          <button id="close-room" class="danger" type="button" disabled>結束課堂</button>
        </div>
        <form id="create-activity">
          <label>講義版本 <select id="catalogs" required><option value="">請先選課程</option></select></label>
          <label>活動名稱 <input name="title" maxlength="128" placeholder="留空則使用講義名稱"></label>
          <button disabled>建立活動</button>
        </form>
        <p class="muted">同堂一次只能有一個準備中或搶答中的活動，請先結束目前活動再建立下一個。</p>
        <ul id="activities" class="activity-list"></ul>
      </section>
<p id="state" role="status"></p><section id="results" aria-label="活動結果"></section><dialog id="feedback-dialog"><h2 id="feedback-title"></h2><p id="feedback-message"></p><form method="dialog"><button>確定</button></form></dialog>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='quiz-submission.js') }}"></script><script type="module" src="{{ url_for('static',filename='classroom.js') }}"></script>{% endblock %}
