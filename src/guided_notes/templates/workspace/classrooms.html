{% extends 'workspace/base.html' %}{% block content %}<h2>課堂管理</h2><p>每次上課建立一次課堂；結束後保留紀錄。</p><form data-create-room><label>本次課堂名稱<input name="title" maxlength="128" required></label><button>建立課堂</button></form><div class="cards">{% for room in rooms %}<a class="card" href="{{ url_for('workspace.classroom',course_id=course.course_id,classroom_id=room.id) }}"><h3>{{ room.title }}</h3><p>{{ '進行中' if room.state=='OPEN' else '已結束' }}</p></a>{% else %}<p>尚無課堂。</p>{% endfor %}</div>{% endblock %}
