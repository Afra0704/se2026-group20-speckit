<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}講義匯入{% endblock %} · Guided Notes</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172b3a; background: #f3f6f8; }
    body { margin: 0; } main { max-width: 1040px; margin: 40px auto; padding: 24px; }
    nav { display: flex; gap: 20px; margin-bottom: 28px; } a { color: #155f88; }
    h1 { margin-bottom: 8px; } .muted { color: #516576; } .card { background: white; border: 1px solid #d5e0e7; border-radius: 12px; padding: 24px; margin: 20px 0; }
    label { display: block; margin: 14px 0; } input, select { display: block; width: 100%; box-sizing: border-box; padding: 12px; margin-top: 6px; border: 1px solid #94aab9; border-radius: 6px; font: inherit; }
    button { background: #155f88; color: white; border: 0; border-radius: 6px; padding: 12px 20px; font: inherit; cursor: pointer; } button:disabled { opacity: .55; cursor: wait; }
    input[type="radio"] { display: inline-block; width: auto; margin: 0 8px 0 0; }
    fieldset { border: 1px solid #d5e0e7; border-radius: 8px; margin: 20px 0; padding: 16px; }
    [hidden] { display: none !important; }
    table { width: 100%; border-collapse: collapse; } th, td { text-align: left; border-bottom: 1px solid #d5e0e7; padding: 12px; vertical-align: top; } td { white-space: pre-wrap; overflow-wrap: anywhere; }
    .scroll { overflow-x: auto; } .metrics { display: flex; gap: 24px; font-size: 1.2rem; } .notice { padding: 14px; background: #eaf4fa; border-left: 4px solid #155f88; } code { overflow-wrap: anywhere; } [role="alert"] { color: #9a2431; }
    @media (max-width: 650px) { main { margin: 8px auto; padding: 14px; } .card { padding: 14px; } }
  </style>
</head>
<body><main>
  <nav aria-label="主要導覽"><a href="{{ url_for('teacher.page') }}">教師活動管理</a><a href="{{ url_for('notes.index') }}">講義匯入</a></nav>
  {% block content %}{% endblock %}
</main><script src="{{ url_for('notes.static', filename='notes.js') }}" defer></script></body>
</html>
