[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guided-notes"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask>=3.1,<4",
    "jinja2>=3.1,<4",
    "google-api-python-client>=2.202,<3",
    "google-auth>=2.63.1,<3",
    "google-auth-oauthlib>=1.5,<2",
    "google-auth-httplib2>=0.4.4,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/guided_notes"]
